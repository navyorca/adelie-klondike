:root{
 /* CMYK 인쇄 톤: 채도 낮춘 남색 계열(쨍함 완화) */
 --paper:#111E3A; --panel:#1B2B52; --ink:#DDE4F2; --dim:#8294BE; --line:#33467E;
 --navy:#0B1530; --blue:#4A6596; --sky:#7E93BE; --mint:#6FA99B;
 --sel:#CBAE57; --red:#AE5E56;
 --f:"Galmuri9","Pretendard Variable","Malgun Gothic",monospace;
 --cw:clamp(42px,12.5vw,92px); --ch:calc(var(--cw)*1.396); --fan:calc(var(--cw)*0.30);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--paper);color:var(--ink);
 font-family:var(--f);font-size:15px;-webkit-font-smoothing:none;font-synthesis:none;overflow-x:hidden}
header{display:flex;align-items:center;gap:8px;padding:9px 12px;background:var(--navy);border-bottom:3px solid var(--sel)}
header h1{font-size:16px;margin:0;color:#fff;letter-spacing:0}
header .grow{flex:1}
button{font-family:inherit;font-size:14px;color:var(--ink);
 background:var(--panel);border:2px solid var(--line);border-radius:6px;padding:6px 10px;cursor:pointer}
button:active{transform:translateY(1px)}
header button{color:#fff;background:transparent;border-color:#fff}
#status{font-size:13px;color:var(--ink);padding:6px 14px;background:var(--panel);border-bottom:1px solid var(--line)}
.board{padding:8px 10px 40px;max-width:900px;margin:0 auto}
.top{display:grid;grid-template-columns:repeat(7,1fr);gap:calc(var(--cw)*0.10);margin-bottom:14px}
.tableau{display:grid;grid-template-columns:repeat(7,1fr);gap:calc(var(--cw)*0.10);align-items:start}
.slot{width:100%;aspect-ratio:1/1.396;border-radius:calc(var(--cw)*0.10);
 border:1.5px dashed var(--line);position:relative}
.foundation{border-color:var(--blue)}
.col{position:relative;min-height:var(--ch)}
.card{position:absolute;left:0;width:100%;aspect-ratio:1/1.396;border-radius:calc(var(--cw)*0.10);
 background:#fff center/cover no-repeat;box-shadow:0 2px 6px rgba(0,0,0,.4);
 border:1px solid rgba(255,255,255,.14);cursor:pointer;user-select:none;
 image-rendering:pixelated;transition:top .12s,box-shadow .12s}
.card.face{background-size:100%}
.card.back{background-size:142%}
.card.sel{box-shadow:0 0 0 3px var(--sel),0 2px 8px rgba(16,26,48,.3)}
.stock-empty{display:flex;align-items:center;justify-content:center;color:#B7C2D6;font-size:20px}
#fx{position:fixed;inset:0;pointer-events:none;z-index:80;display:none}
#fxdom{position:fixed;inset:0;pointer-events:none;z-index:78;display:none;overflow:hidden}
.fxcard{position:absolute;width:60px;border-radius:7px;box-shadow:0 2px 7px rgba(16,26,48,.3)}
.fxpeng{position:absolute;width:74px;animation:dance .5s ease-in-out infinite}
@keyframes dance{0%,100%{transform:translateY(0) rotate(-9deg)}50%{transform:translateY(-28px) rotate(9deg)}}
.shake{animation:shk .4s}
@keyframes shk{0%,100%{transform:translateX(0)}20%{transform:translateX(-7px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
#opt{position:fixed;inset:0;display:none;align-items:center;justify-content:center;background:rgba(4,9,26,.6);z-index:90}
#opt .panel{background:var(--panel);border:1.5px solid var(--line);border-radius:16px;padding:18px 20px;min-width:270px;box-shadow:0 12px 44px rgba(0,0,0,.5)}
#opt h2{margin:0 0 14px;font-size:17px;color:var(--sel);font-weight:800}
#opt .row{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:12px 0}
#opt .row>span{font-size:14px;color:var(--ink);font-weight:600}
#opt .seg{display:flex;gap:6px}
#opt .seg button{padding:6px 10px;font-size:12px}
#opt .seg button.on{background:var(--blue);color:#fff;border-color:var(--blue)}
#opt .close{width:100%;margin-top:14px;background:var(--sel);color:var(--navy);border-color:var(--sel)}
#win small{color:var(--sky);font-size:14px;font-weight:600}
#win{position:fixed;inset:0;display:none;align-items:center;justify-content:center;
 background:rgba(9,20,54,.86);z-index:70;flex-direction:column;gap:16px}
#win b{font-size:26px;color:var(--sel);font-weight:800}
#win img{width:84px;height:auto;animation:hop .7s ease-in-out infinite}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-16px) rotate(-4deg)}}
.pile-top{position:absolute;top:0;left:0;width:100%}
</style></head><body>

</header>

const RED=new Set(['H','D']);
const img=c=>CARDS[c.s+c.r];
let stock,waste,found,tab,drawN=3,hist,sel=null,won=false;

// ---- 성공 색종이 이펙트 ----
const fxc=document.getElementById('fx');
const COLORS=['#CBAE57','#AE5E56','#4A6596','#6FA99B','#7E93BE','#DDE4F2'];
let fxParts=[],fxRun=false,fxEnd=0;
function fxResize(){fxc.width=innerWidth;fxc.height=innerHeight;}
function burst(){
 fxResize();fxc.style.display='block';
 const cx=innerWidth/2, cy=innerHeight*0.42;
 fxParts=[];
 for(let i=0;i<160;i++){const a=Math.random()*Math.PI*2, sp=3+Math.random()*7;
  fxParts.push({x:cx,y:cy,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-4,
   s:5+Math.random()*7,c:COLORS[i%COLORS.length],rot:Math.random()*6,vr:(Math.random()-.5)*.4,g:0.14+Math.random()*0.08});}
 for(let i=0;i<120;i++){fxParts.push({x:Math.random()*innerWidth,y:-20-Math.random()*200,
  vx:(Math.random()-.5)*2,vy:2+Math.random()*3,s:5+Math.random()*7,
  c:COLORS[i%COLORS.length],rot:Math.random()*6,vr:(Math.random()-.5)*.4,g:0.1});}
 fxEnd=performance.now()+4200;
 if(!fxRun){fxRun=true;requestAnimationFrame(fxStep);}
}
function fxStep(t){
 const ctx=fxc.getContext('2d');ctx.clearRect(0,0,fxc.width,fxc.height);
 for(const p of fxParts){p.vy+=p.g;p.x+=p.vx;p.y+=p.vy;p.rot+=p.vr;
  ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.rot);ctx.fillStyle=p.c;
  ctx.fillRect(-p.s/2,-p.s/2,p.s,p.s*0.6);ctx.restore();}
 fxParts=fxParts.filter(p=>p.y<fxc.height+30);
 if(performance.now()<fxEnd&&fxParts.length){requestAnimationFrame(fxStep);}
 else{fxRun=false;ctx.clearRect(0,0,fxc.width,fxc.height);fxc.style.display='none';}
}
addEventListener('resize',()=>{if(fxRun)fxResize();});

// ---- 사운드(WebAudio 합성, 파일 없음) ----
let AC,soundOn=true,winFx='random',score=0,moves=0,t0=0,tick=null;
function ac(){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume();}catch(e){}return AC;}
function blip(f,d,t,v){if(!soundOn)return;const c=ac();if(!c)return;const o=c.createOscillator(),g=c.createGain();
 o.type=t||'sine';o.frequency.value=f;o.connect(g);g.connect(c.destination);const n=c.currentTime;
 g.gain.setValueAtTime(v||.07,n);g.gain.exponentialRampToValueAtTime(.0001,n+d);o.start(n);o.stop(n+d);}
function sndMove(){blip(500,.07,'triangle',.06);}
function sndFlip(){blip(300,.05,'square',.04);}
function sndWrong(){blip(150,.16,'sawtooth',.09);setTimeout(()=>blip(110,.14,'sawtooth',.08),55);}
function sndWin(){[523,659,784,1047,1319].forEach((f,i)=>setTimeout(()=>blip(f,.3,'triangle',.08),i*130));}
addEventListener('pointerdown',()=>ac(),{once:true});

// ---- 스코어·타이머 ----
function fmtT(ms){const s=Math.floor(ms/1000);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0');}
function startTimer(){t0=Date.now();if(tick)clearInterval(tick);tick=setInterval(setStatus,1000);}
function stopTimer(){if(tick){clearInterval(tick);tick=null;}}
function addScore(n){score=Math.max(0,score+n);}

// ---- 완성 연출(랜덤): 색종이·카드폭포·펭귄댄스 ----
const fxdom=document.getElementById('fxdom');
function cascade(){fxdom.style.display='block';fxdom.innerHTML='';
 const codes=[];for(const s of ['S','H','D','C'])for(let r=1;r<=13;r++)codes.push(s+r);shuffle(codes);
 const live=[];let idx=0,fr=0,sp=0;
 const loop=()=>{fr++;sp++;
  if(sp>5&&idx<28){sp=0;const c=codes[idx++];const el=document.createElement('img');el.src=CARDS[c];el.className='fxcard';
   const x=innerWidth*(.2+Math.random()*.6);el.style.left=x+'px';el.style.top='-90px';fxdom.appendChild(el);
   live.push({el,x,y:-90,vx:(Math.random()*2-1)*7,vy:1+Math.random()*2});if(idx%4===0)sndFlip();}
  for(const p of live){p.vy+=.45;p.x+=p.vx;p.y+=p.vy;
   if(p.y>innerHeight-96){p.y=innerHeight-96;p.vy*=-.52;p.vx*=.82;}
   if(p.x<0||p.x>innerWidth-60){p.vx*=-.7;p.x=Math.max(0,Math.min(innerWidth-60,p.x));}
   p.el.style.left=p.x+'px';p.el.style.top=p.y+'px';p.el.style.transform='rotate('+(p.x*.4)+'deg)';}
  if(fr<380)requestAnimationFrame(loop);else setTimeout(()=>{fxdom.style.display='none';fxdom.innerHTML='';},900);};
 requestAnimationFrame(loop);}
function danceP(){fxdom.style.display='block';fxdom.innerHTML='';const n=7;
 for(let i=0;i<n;i++){const el=document.createElement('img');el.src=BACK;el.className='fxpeng';
  el.style.left=(innerWidth*(i+.5)/n-37)+'px';el.style.bottom='46px';el.style.animationDelay=(i*.11)+'s';fxdom.appendChild(el);}
 setTimeout(()=>{fxdom.style.display='none';fxdom.innerHTML='';},3800);}
function celebrate(){sndWin();let k=winFx;if(k==='random')k=['confetti','cascade','dance'][Math.floor(Math.random()*3)];
 if(k==='confetti')burst();else if(k==='cascade')cascade();else danceP();}

// ---- 옵션(로컬 저장) ----
function loadOpt(){try{const o=JSON.parse(localStorage.getItem('adelie_klon')||'{}');
 if('snd'in o)soundOn=!!o.snd;if(o.draw)drawN=o.draw;if(o.fx)winFx=o.fx;}catch(e){}}
function saveOpt(){try{localStorage.setItem('adelie_klon',JSON.stringify({snd:soundOn?1:0,draw:drawN,fx:winFx}));}catch(e){}}
function syncOptUI(){
 document.querySelectorAll('#o-snd button').forEach(b=>b.classList.toggle('on',(b.dataset.v==='1')===soundOn));
 document.querySelectorAll('#o-draw button').forEach(b=>b.classList.toggle('on',+b.dataset.v===drawN));
 document.querySelectorAll('#o-fx button').forEach(b=>b.classList.toggle('on',b.dataset.v===winFx));}
function shakeEl(to,ti){const el=(to==='tab'?document.querySelectorAll('.col'):document.querySelectorAll('.foundation'))[ti];
 if(el){el.classList.remove('shake');void el.offsetWidth;el.classList.add('shake');setTimeout(()=>el.classList.remove('shake'),420);}}

function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a}
function snapshot(){return JSON.stringify({stock,waste,found,tab,score,moves})}
function pushHist(){hist.push(snapshot());if(hist.length>200)hist.shift()}

function newGame(){
 const deck=[];for(const s of ['S','H','D','C'])for(let r=1;r<=13;r++)deck.push({s,r,up:false});
 shuffle(deck);
 tab=[[],[],[],[],[],[],[]];
 for(let i=0;i<7;i++){for(let j=i;j<7;j++){const c=deck.pop();c.up=(j===i);tab[j].push(c)}}
 stock=deck;stock.forEach(c=>c.up=false);
 waste=[];found=[[],[],[],[]];hist=[];sel=null;won=false;score=0;moves=0;
 document.getElementById('win').style.display='none';
 if(fxc){fxc.style.display='none';}
 if(fxdom){fxdom.style.display='none';fxdom.innerHTML='';}
 startTimer();
 render();
}
function cardEl(c,top,faceUp){
 const d=document.createElement('div');d.className='card'+(faceUp?' face':' back');
 d.style.top=top+'px';
 d.style.backgroundImage=`url(${faceUp?img(c):BACK})`;
 return d;
}
function clearSel(){sel=null;render()}
function setStatus(){
 const f=found.reduce((a,p)=>a+p.length,0);
 const tm=t0?fmtT(Date.now()-t0):'00:00';
 document.getElementById('status').textContent=`완성 ${f}/52 · 점수 ${score} · 이동 ${moves} · 시간 ${tm} · 뽑기 ${drawN}장`;
}
function render(){
 // stock
 const st=document.getElementById('stock');st.innerHTML='';
 if(stock.length){const d=cardEl(stock[stock.length-1],0,false);d.onclick=onStock;st.appendChild(d);}
 else{st.innerHTML='<div class="card stock-empty" style="top:0">↻</div>';st.firstChild.onclick=onStock;}
 // waste
 const wa=document.getElementById('waste');wa.innerHTML='';
 if(waste.length){const c=waste[waste.length-1];const d=cardEl(c,0,true);
  d.classList.toggle('sel',sel&&sel.from==='waste');
  d.onclick=()=>pick('waste',null,null);d.ondblclick=()=>autoFound('waste');wa.appendChild(d);}
 // foundations
 document.querySelectorAll('.foundation').forEach((el,i)=>{el.querySelectorAll('.card').forEach(x=>x.remove());
  const p=found[i];if(p.length){const d=cardEl(p[p.length-1],0,true);d.classList.add('pile-top');
   d.onclick=()=>pick('found',i,null);el.appendChild(d);}
 });
 // tableau
 const tb=document.getElementById('tab');tb.innerHTML='';
 tab.forEach((col,ci)=>{const cd=document.createElement('div');cd.className='col';
  tb.appendChild(cd);
  const w=cd.clientWidth||70, fanUp=w*0.32, fanDown=w*0.15;
  let y=0;
  col.forEach((c,idx)=>{const d=cardEl(c,y,c.up);
   if(c.up){d.onclick=()=>pick('tab',ci,idx);d.ondblclick=()=>autoFoundTab(ci,idx);
    if(sel&&sel.from==='tab'&&sel.col===ci&&sel.idx===idx)d.classList.add('sel');}
   cd.appendChild(d);y+=(c.up?fanUp:fanDown);});
  cd.style.height=(y+ (w*1.396))+'px';
  // 빈 칸에도 드롭 받도록 클릭 영역
  cd.addEventListener('click',e=>{if(e.target===cd)drop('tab',ci);});
 });
 // 파운데이션 빈칸 드롭
 document.querySelectorAll('.foundation').forEach((el,i)=>{el.onclick=e=>{if(sel)drop('found',i);};});
 setStatus();
 if(!won&&found.every(p=>p.length===13)){
  won=true;stopTimer();addScore(700);
  document.getElementById('winpeng').src=BACK;
  document.getElementById('winscore').textContent=`점수 ${score} · 이동 ${moves} · 시간 ${t0?fmtT(Date.now()-t0):'00:00'}`;
  document.getElementById('win').style.display='flex';
  celebrate();
 }
}
function onStock(){
 pushHist();
 if(stock.length===0){stock=waste.reverse().map(c=>(c.up=false,c));waste=[];}
 else{for(let k=0;k<drawN&&stock.length;k++){const c=stock.pop();c.up=true;waste.push(c);}}
 moves++;sndFlip();sel=null;render();
}
function topMovable(from,col,idx){
 if(from==='waste')return [waste[waste.length-1]];
 if(from==='found')return [found[col][found[col].length-1]];
 return tab[col].slice(idx);
}
function pick(from,col,idx){
 if(sel){ // 이미 선택됨 → 목적지 시도
  if(sel.from===from&&sel.col===col&&sel.idx===idx){clearSel();return;}
  drop(from,col);return;
 }
 sel={from,col,idx};render();
}
function canToFound(c,fi){const p=found[fi];
 if(p.length===0)return c.r===1;const t=p[p.length-1];return t.s===c.s&&c.r===t.r+1;}
function canToTab(c,ci){const col=tab[ci];
 if(col.length===0)return c.r===13;const t=col[col.length-1];
 return t.up&&(RED.has(t.s)!==RED.has(c.s))&&c.r===t.r-1;}
function removeFrom(sel){
 if(sel.from==='waste')return [waste.pop()];
 if(sel.from==='found')return [found[sel.col].pop()];
 const moved=tab[sel.col].splice(sel.idx);return moved;
}
function flipExposed(){tab.forEach(col=>{if(col.length&&!col[col.length-1].up){col[col.length-1].up=true;addScore(5);sndFlip();}});}
function drop(to,ti){
 if(!sel){return;}
 const moving=topMovable(sel.from,sel.col,sel.idx);
 const first=moving[0];
 let ok=false;
 if(to==='found'&&moving.length===1&&canToFound(first,ti))ok=true;
 if(to==='tab'&&canToTab(first,ti))ok=true;
 if(!ok){sndWrong();shakeEl(to,ti);clearSel();return;}
 pushHist();
 if(sel.from==='found')addScore(-15);
 const cards=removeFrom(sel);
 if(to==='found'){found[ti].push(cards[0]);addScore(10);}
 else{tab[ti].push(...cards);if(sel.from==='waste')addScore(5);}
 moves++;sndMove();flipExposed();sel=null;render();
}
function autoFound(from,col,idx){ // waste/tab top → 파운데이션 자동
 let c,src;
 if(from==='waste'){if(!waste.length)return;c=waste[waste.length-1];src={from:'waste'};}
 for(let fi=0;fi<4;fi++){if(canToFound(c,fi)){sel=src;drop('found',fi);return;}}
 clearSel();
}
function autoFoundTab(ci,idx){
 if(idx!==tab[ci].length-1)return; // 맨 위만
 const c=tab[ci][idx];
 for(let fi=0;fi<4;fi++){if(canToFound(c,fi)){sel={from:'tab',col:ci,idx};drop('found',fi);return;}}
 clearSel();
}
document.getElementById('new').onclick=newGame;
document.getElementById('undo').onclick=()=>{if(hist.length){const s=JSON.parse(hist.pop());stock=s.stock;waste=s.waste;found=s.found;tab=s.tab;score=s.score||0;moves=s.moves||0;sel=null;render();}};
document.getElementById('opt-btn').onclick=()=>{syncOptUI();document.getElementById('opt').style.display='flex';};
document.querySelectorAll('#o-snd button').forEach(b=>b.onclick=()=>{soundOn=b.dataset.v==='1';if(soundOn)sndFlip();saveOpt();syncOptUI();});
document.querySelectorAll('#o-draw button').forEach(b=>b.onclick=()=>{drawN=+b.dataset.v;saveOpt();syncOptUI();setStatus();});
document.querySelectorAll('#o-fx button').forEach(b=>b.onclick=()=>{winFx=b.dataset.v;saveOpt();syncOptUI();});
// 자체 점검: 새 게임 시 52장 유일성
function sanity(){const all=[...stock,...waste,...found.flat(),...tab.flat()];
 const set=new Set(all.map(c=>c.s+c.r));console.assert(all.length===52&&set.size===52,'카드 52 유일성 실패');}
loadOpt();newGame();sanity();
</script></body></html>
